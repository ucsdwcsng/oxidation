[workspace]
resolver = "2"
members = ["crates/*", "."]

[package]
name = "oxidation"
version = "0.1.0"
edition.workspace = true

[workspace.package]
edition = "2021"

[workspace.dependencies]
bytemuck = "1.17.0"
geojson = "0.24.1"
indicatif = "0.17.8"
num-complex = "0.4.6"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
sha2 = "0.10.8"
sigmf = { version = "0.1.0", path = "crates/sigmf" }
tar = "0.4"
users = "0.11.0"
uuid = "1.10.0"

[dependencies]
sigmf.workspace = true
