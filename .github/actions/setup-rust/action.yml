name: Set up Rust
description: >
  Install a Rust toolchain and pin it with RUSTUP_TOOLCHAIN for the rest of the
  job, so a runner's `rustup override`, rust-toolchain file, or environment
  cannot select a different toolchain.

inputs:
  toolchain:
    description: Rustup toolchain to install, e.g. `stable` or `1.89`.
    default: stable
  components:
    description: Comma-separated rustup components, e.g. `clippy, rustfmt`.
    default: ""

runs:
  using: composite
  steps:
    - id: toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - name: Pin toolchain
      shell: bash
      run: |
        echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.name }}" >> "$GITHUB_ENV"
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
    - name: Show toolchain
      shell: bash
      run: |
        rustup show active-toolchain
        cargo --version
        rustc --version
