name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo check -p wcsng-sigmf --no-default-features
      - run: cargo check -p wcsng-sigmf --features derive
      - run: cargo check -p wcsng-sigmf --features schema
      - run: cargo test -p wcsng-sigmf --features derive,schema --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

